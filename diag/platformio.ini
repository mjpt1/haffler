; Haffler CodeRun V3 (ESP32-S3-WROOM-1) - pet eyes
; Open this folder in VS Code with the PlatformIO extension.
; The sketch also opens directly in Arduino IDE: pet_eyes/pet_eyes.ino

[platformio]

[env:coderun]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = min_spiffs.csv   ; 2 x 1.9 MB app slots for OTA
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; upload + Serial via USB2 (native USB, COM4)
lib_deps =
